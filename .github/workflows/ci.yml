name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: User admin policy tests
        run: npx ts-node tests/user-admin-policy.test.ts

      - name: Workflow cycle tests
        run: npx ts-node tests/workflow-cycle.test.ts

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint
