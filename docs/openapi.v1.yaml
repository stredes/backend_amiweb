openapi: 3.1.0
info:
  title: AMIWEB Backend API
  version: "1.0.0"
  description: |
    Contrato congelado para integración Front-Backend.
    Fecha de congelamiento: 2026-03-01.
    Versión activa: /api/v1/* (compatibilidad temporal con /api/*).
servers:
  - url: https://backend-amiweb.vercel.app
    description: production
  - url: https://backend-amiweb-<preview>.vercel.app
    description: preview
  - url: http://localhost:3000
    description: local
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      summary: Liveness
      security: []
      responses:
        "200":
          description: healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/ready:
    get:
      summary: Readiness (dependencias)
      security: []
      responses:
        "200":
          description: ready
        "503":
          description: dependency not ready
  /api/auth/me:
    get:
      summary: Perfil autenticado
      responses:
        "200":
          description: ok
        "401":
          description: token inválido/faltante
  /api/search:
    get:
      summary: Búsqueda global
      security: []
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
        - in: query
          name: scope
          schema:
            type: string
            enum: [catalog, global]
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: resultados
        "400":
          description: query inválida
        "401":
          description: scope global requiere auth
  /api/users:
    get:
      summary: Directorio de usuarios
      responses:
        "200": { description: ok }
    post:
      summary: Crear usuario (root)
      responses:
        "201": { description: created }
        "409": { description: user exists }
  /api/users/{id}:
    get:
      summary: Obtener usuario
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200": { description: ok }
    put:
      summary: Editar usuario
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200": { description: ok }
    delete:
      summary: Eliminar usuario
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200": { description: ok }
  /api/users/{id}/status:
    patch:
      summary: Activar/Desactivar usuario
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200": { description: ok }
  /api/users/{id}/reset-password:
    post:
      summary: Reset password usuario
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200": { description: ok }
  /api/users/{id}/audit:
    get:
      summary: Auditoría de usuario
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200": { description: ok }
  /api/admin/kpis:
    get:
      summary: KPIs ejecutivos admin
      responses:
        "200": { description: ok }
  /api/admin/clients:
    get:
      summary: Cartera de clientes admin
      responses:
        "200": { description: ok }
  /api/admin/operations:
    get:
      summary: Control operativo admin
      responses:
        "200": { description: ok }
  /api/admin/approvals/pending:
    get:
      summary: Aprobaciones pendientes
      responses:
        "200": { description: ok }
  /api/vendor/kpis:
    get:
      summary: KPIs vendedor
      responses:
        "200": { description: ok }
  /api/vendor/pipeline:
    get:
      summary: Pipeline vendedor
      responses:
        "200": { description: ok }
  /api/vendor/agenda:
    get:
      summary: Agenda vendedor
      responses:
        "200": { description: ok }
  /api/vendor/clients:
    get:
      summary: Clientes vendedor
      responses:
        "200": { description: ok }
  /api/vendor/orders:
    get:
      summary: Pedidos vendedor
      responses:
        "200": { description: ok }
  /api/vendor/quotes/pending:
    get:
      summary: Cotizaciones pendientes vendedor
      responses:
        "200": { description: ok }
  /api/vendor/quotes/{id}/approve:
    post:
      summary: Aprobar cotización vendedor
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200": { description: ok }
  /api/vendor/quotes/{id}/reject:
    post:
      summary: Rechazar cotización vendedor
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200": { description: ok }
  /api/orders:
    get:
      summary: Listado de pedidos
      responses:
        "200": { description: ok }
    post:
      summary: Crear pedido
      responses:
        "201": { description: created }
  /api/orders/{id}:
    get:
      summary: Pedido por id
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200": { description: ok }
    patch:
      summary: Mutación de estado pedido
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200": { description: ok }
  /api/quotes:
    get:
      summary: Listado de cotizaciones
      responses:
        "200": { description: ok }
    post:
      summary: Crear cotización
      responses:
        "201": { description: created }
  /api/quotes/{id}/vendor-approve:
    post:
      summary: Aprobar/Rechazar vendedor
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200": { description: ok }
  /api/quotes/{id}/admin-approve:
    post:
      summary: Aprobar/Rechazar admin
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200": { description: ok }
  /api/notifications:
    get:
      summary: Listar notificaciones
      responses:
        "200": { description: ok }
    patch:
      summary: Marcar notificaciones leídas
      responses:
        "200": { description: ok }
components:
  parameters:
    PathId:
      in: path
      name: id
      required: true
      schema:
        type: string
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
      required: [success, data]
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string
        code:
          type: string
        details:
          type: object
          properties:
            requestId:
              type: string
      required: [success, error, code]
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
